      body: |
        <!-- kcc-greenfield-bulkgen:step-2 -->
        **Kind:** `{{ .Params.kind }}` | **Step 2: Controller, fixtures and fuzzer** (pipeline: 1a → 1b → **2** → 3 → 4 → 5)

        > [!NOTE]
        > This issue is self-contained: it inlines every KCC skill this step needs, so you don't need to open anything under `.gemini/skills/`. If a skill, a doc under `docs/`, or `GEMINI.md` disagrees with this issue, follow this issue.

        Generate `{{ .Params.kind }}`'s direct controller and round-trip fuzzer with `controllerbuilder`, add minimal and maximal E2E fixtures, and record their golden logs against **real GCP**.

        ## Values you need

        | Value | How to find it |
        |---|---|
        | `<group>` | The `apis/<group>/` directory holding `<kind_lowercase>_types.go`. The API group is `<group>.cnrm.cloud.google.com`. |
        | `<proto.package>`, `<ProtoMessage>` | `+kcc:spec:proto=` in `apis/<group>/v1alpha1/<kind_lowercase>_types.go`. |
        | `<proto_lower>` | `<ProtoMessage>` in lowercase. The controller is `pkg/controller/direct/<group>/<proto_lower>_controller.go`. |
        | `<service_name>` | The proto's `option (google.api.default_host)`, as in `<service_name>.googleapis.com`. |

        ## Guardrails

        - **Judgement must be finished.** `{{ .Params.kind }}`'s `untriaged-bulk-generation` and every actionable `{{ .Params.kind }}` entry in `apis/<group>/judgement_queue.yaml` are `resolved`, and `{{ .Params.kind }}Spec` has no top-level `Labels`. If not, comment on this issue that Step 1b isn't done, and stop.
        - **Existing handwritten controller?** If `grep -rn "RegisterModel(.*{{ .Params.kind }}GVK" pkg/controller/direct/<group>/` finds a controller **without** `// +generated:controller`, this issue doesn't fit. Comment and stop.
        - **Real GCP only.** Ignore anything in `GEMINI.md` or `mockgcp/GEMINI.md` about MockGCP, `E2E_GCP_TARGET=mock` or `hack/compare-mock`. MockGCP is Step 3.
        - **Never fake logs.** Never create or edit `_http.log`, `_audit_probe.log` or `*.golden.yaml` by hand (no editor, no `sed`), and never fall back to mock logs.
        - **Stay in scope**, and don't edit any `SKILL.md`. Put general learnings in the PR's "Workflow feedback" section.

        ## 1. Generate the controller and fuzzer

        1. In `apis/<group>/generate.sh`, after `generate-mapper --prepopulate-resource`, make sure both of these exist for `{{ .Params.kind }}`:
           ```bash
           ${CONTROLLERBUILDER} generate-controller \
             --service <proto.package> \
             --api-version <group>.cnrm.cloud.google.com/v1alpha1 \
             --prepopulate-resource \
             --resource {{ .Params.kind }}:<ProtoMessage>

           ${CONTROLLERBUILDER} generate-fuzzer \
             --prepopulate-resource \
             --service <proto.package> \
             --api-version <group>.cnrm.cloud.google.com/v1alpha1 \
             --resource {{ .Params.kind }}:<ProtoMessage>
           ```
           If `generate-types` pins `--proto-source-path ${REPO_ROOT}/.build/googleapis-<sha>.pb`, pass the same flag to `generate-mapper`, `generate-controller` and `generate-fuzzer`.
        2. Generate and register. Both commands are mandatory:
           ```bash
           SKIP_GENERATE_CRDS=1 ./apis/<group>/generate.sh
           python3 dev/tasks/generate_static_config.py
           ```
           This writes `pkg/controller/direct/<group>/<proto_lower>_controller.go` (marked `// +generated:controller`), `pkg/controller/direct/<group>/<kind_lowercase>_fuzzer.generated.go` (marked `// +generated:fuzzer`), and the registration in `pkg/controller/direct/register/register.go` and `pkg/controller/resourceconfig/static_config.go`. Never edit `static_config.go` by hand.
        3. Hard cases:
           - **Missing GAPIC module** (e.g. `iam/apiv3`, `dialogflow` spanning `v2` and `cx/v3`, `mapmanagement/apiv2`): run `go get cloud.google.com/go/<service_name>@latest && go mod tidy && (cd mockgcp && go mod tidy)`, so both modules stay aligned (`validate-ensure`).
           - **Mapper collisions** in shared or legacy packages: if `mapper.generated.go` can't be regenerated without clobbering existing mockgcp or multi-service mappers (or `v1alpha1` and `v1beta1` types collide), isolate `{{ .Params.kind }}`'s mappers in `pkg/controller/direct/<group>/<kind_lowercase>_mapper.go`, or pass `--multiversion` to `generate-mapper`.
           - **Immutable resources without an `Update*` RPC:** `Update` refreshes status (`a.setStatus(u, actual)`) without calling an update RPC. Resolve every `// TODO:` in `<proto_lower>_controller.go`.
           - **CAI and labels tests:** run `go test ./pkg/gcpurls/... ./pkg/test/resourcefixture/... -run "TestRegisteredTemplatesMatchCAI|TestVerifyLabelsTestCasesExist"`. If `{{ .Params.kind }}`'s URL template is missing from CAI, add it to `ignoredTemplates` in `pkg/gcpurls/registry_test.go`.
        4. Check straight away:
           ```bash
           go test ./pkg/controller/direct/<group>/...
           FOCUS={{ .Params.kind }} go test -v ./pkg/fuzztesting/fuzztests -run TestFocusedMappers
           go test -v ./tests/apichecks -run "TestGenerateScripts|TestDirectResourceFileNaming"
           ```
           If `TestFocusedMappers` fails, read the `// HINT:` comments in `<kind_lowercase>_fuzzer.generated.go` and the `<hint_for_agent>...</hint_for_agent>` block in the test output, then fix the mapper or configure `FilterSpec` / `FilterStatus`.

        ## 2. Check the controller against the five greenfield standards

        The generator should get these right. Verify them, and change the controller only where real GCP proves it wrong.

        1. **Client.** The GAPIC REST client (`New<Service>RESTClient` with `m.config.RESTClientOptions()`). Fall back to the gRPC client (`New<Service>Client` with `m.config.GRPCClientOptions()`) only if REST is unsupported or broken on real GCP (e.g. 403, 404 or LRO errors), and say why in the PR.
        2. **References.** `common.NormalizeGreenfieldReferences(...)` is called first in `AdapterForObject`, before `GetIdentity` and before `{{ .Params.kind }}Spec_ToProto`.
        3. **Identity.** `AdapterForObject` calls `obj.GetIdentity(ctx, reader)` and asserts `*krm.{{ .Params.kind }}Identity`. The parent in requests comes from the identity (`ParentString()`), never from spec fields. If the proto message has a `parent` field, set it from `a.id.ParentString()` in `Create`. If the controller implements export (`AdapterForURL`/`Export`), build the parent fields from the identity: for a child resource `obj.Spec.ParentRef = &krm.<ParentKind>Ref{External: a.id.ParentString()}`, for a top-level one `projectRef` (or `folderRef`/`organizationRef`) and `location`. Server-generated IDs: see section 3.
        4. **Diff.** `Update` uses `common.CompareGreenfieldSpec(ctx, a.desired, actual, krm.{{ .Params.kind }}Spec_FromProto)`, or `common.CompareGreenfieldSpecAndLabels(..., a.labels)` when top-level proto `labels` are reconciled from `metadata.labels`. Never `common.CompareProtoMessage` or `common.CompareBrownfieldSpec`. When paths changed, it calls `structuredreporting.ReportDiff(ctx, report)` before sending the update request.
        5. **LROs and status.** `Create`, `Update` and `Delete` wait on every LRO (`op.Wait(ctx)`), `GET` the resource after `Create`/`Update` LROs when the LRO result is incomplete, and call `setStatus(u, resolved)` at the end of `Create` and on **every** `Update` path, no-op updates included.

        ## 3. Server-generated IDs (only if `{{ .Params.kind }}Identity` is a `ServerGeneratedIdentity`)

        - The identity never defaults the ID to `metadata.name`; an empty `spec.resourceID` means "create a new one".
        - The first line of `Find` is `if a.id.<ID> == "" { return false, nil }`. A 404 on a non-empty ID is the usual `false, nil`.
        - `Create` never sets the name or ID in the request. It reads the assigned ID back with `a.id.FromExternal(created.GetName())`, and `setStatus` writes `status.externalRef = direct.LazyPtr(a.id.String())`.
        - `GetIdentity`, when `status.externalRef` is set: with an empty `spec.resourceID`, check that the parent parts match and return the status identity; with a non-empty one, it must equal the status ID, otherwise return `cannot change resource identity (old=%q, new=%q)`.

        ## 4. Fixtures

        Put fixtures under `pkg/test/resourcefixture/testdata/basic/<group>/v1alpha1/<kind_lowercase>/`. Directory names must contain the kind name.

        - **`<kind_lowercase>-minimal/`**
          - `create.yaml`: only the required spec fields, including the parent. Use `${uniqueId}` in names and `${projectId}` for the project.
          - `update.yaml`: changes mutable fields that `create.yaml` sets. Leave it out only if nothing is mutable or there's no update RPC.
          - `dependencies.yaml`: every prerequisite KCC object `create.yaml` refers to, such as the parent resource.
        - **`<kind_lowercase>-maximal/`**: every supported spec field, with an `update.yaml` that changes all the mutable fields it sets, and its own `dependencies.yaml`. Add sibling fixture directories for mutually exclusive `oneof` fields.
        - Never change the parent fields (`parentRef`, or `projectRef`/`location`) in `update.yaml`.
        - Set the parent the way `{{ .Params.kind }}Spec` models it (see Step 1b's single-parent rule):
          ```yaml
          # Top-level resource (project + location parent)
          spec:
            projectRef:
              external: projects/${projectId}
            location: us-central1
          ---
          # Child resource: spec.parentRef names the parent, which dependencies.yaml creates
          spec:
            parentRef:
              name: <parentkind>-${uniqueId}
          ```
          If the parent's reference type is external-only (`External` only), create the parent in `dependencies.yaml` with the KCC kind that manages it and set `parentRef: {external: <the parent's full name>}`.
        - **Ratcheting (mandatory):** in `tests/e2e/ratcheting.go`, remove any `case` for `{{ .Params.kind }}` from the `switch` in `ShouldTestRereconiliation`, so re-reconciliation (SSA) is tested.

        ## 5. Record against real GCP

        Note the start and end times in PDT and the GCP project; they go in the PR. Compiling and recording often take 10–20+ minutes, so give the shell a long timeout (30 minutes).

        ```bash
        go run ./hack/find-test-targets          # lists the fixtures your change affects; record all of them
        RECORD_AUDIT_PROBE=1 ./hack/record-gcp "fixtures/^<kind_lowercase>-minimal$"
        RECORD_AUDIT_PROBE=1 ./hack/record-gcp "fixtures/^<kind_lowercase>-maximal$"
        ```

        `RECORD_AUDIT_PROBE=1 ./hack/record-gcp "fixtures/<kind_lowercase>"` records all of them in one run.

        - **A fixture is done** when the output shows `=== RUN   TestAllInSeries/fixtures/<test>`, the resource reached `Ready` on create (and update), `Done waiting for resource to delete`, and `wrote updated golden output to .../_http.log`, with no panic, timeout or permission abort, and `_http.log` and `_audit_probe.log` exist.
        - **Don't re-record for noise.** LRO poll counts, tokens, ETags, cookies and timestamps are normalization issues: fix them in `tests/e2e/normalize.go`. Re-record only after changing fixture YAML or the requests the controller sends. `hack/record-gcp` only warns on golden diffs, so don't re-run it just to check the goldens.
        - **Failures.** Missing dependency: add it to `dependencies.yaml`. Invalid argument: fix the YAML using the API reference. API disabled: `gcloud services enable <service_name>.googleapis.com`. After 3 distinct failed attempts, stop and explain the blocker in a comment on this issue.

        ## 6. Validate

        ```bash
        dev/ci/presubmits/fuzz-roundtrippers
        WRITE_GOLDEN_OUTPUT=1 go test -v ./tests/apichecks/... -run TestCRDFieldPresenceInTestsForAlpha   # the maximal fixture should shrink alpha-missingfields.txt
        go test ./tests/apichecks/... ./pkg/controller/direct/<group>/...
        go test ./pkg/gcpurls/... ./pkg/test/resourcefixture/... -run "TestRegisteredTemplatesMatchCAI|TestVerifyLabelsTestCasesExist"
        make ready-pr
        ```

        Don't run the fixtures against MockGCP in this step. If something fails, fix it where it belongs (controller, mapper, fuzzer, fixture or normalizer) and repeat. Commit everything, including the recorded logs.

