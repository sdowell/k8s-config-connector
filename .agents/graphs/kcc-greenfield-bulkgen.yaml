        ## Guardrails

        - **Legacy check.** If `<kind_lowercase>_types.go` exists but the queue has no open `untriaged-bulk-generation` entry for `{{ .Params.kind }}`, this step doesn't apply. Comment what you found on this issue and close it as **not planned** (`gh issue close <this issue's number> --reason "not planned" --comment "<what you found>"`). If you can't close it, leave the comment and stop.
        - **Stay in scope.** Touch only `{{ .Params.kind }}`'s files, the shared files named below, and parent or target identity/reference files when a section says so. Don't refactor other kinds.
        - **Don't edit any `SKILL.md`.** Put general learnings in the PR's "Workflow feedback" section.

        ## Queue rules (read these first)

        1. **Work field by field.** Entries are grouped by `(group, kind)`: `untriaged-bulk-generation` first, then kind-level entries (`field: ""`), then field-level entries grouped by `field`. Decide all signals for one `(kind, field)` together.
        2. **Never delete an entry.** Change `status: open` to `status: resolved` and add a `resolution` (`accepted`, `edited`, `deferred` or `not-applicable`) and a clear `note`. The note is required for `edited`, `deferred` and `not-applicable`.
        3. **Scope.** Resolve every entry with `kind: {{ .Params.kind }}`, plus any legacy `protoMessage:` entry reachable from `{{ .Params.kind }}Spec` or `{{ .Params.kind }}ObservedState`. Leave other kinds' entries alone. `well-known-proto-type` and `sensitive-field` are team-policy items: leave them `open`, or resolve them as `deferred` with a note.
        4. **Reference signals agree.** All reference entries (`authoritative-proto-reference`, `possible-reference*`) for one `(kind, group, field)` must end with the same status, or `TestJudgementQueueIsWellFormed` fails.
        5. **Remove `+kcc:guess` markers** for every resolved entry from `<kind_lowercase>_types.go`, `<kind_lowercase>_identity*.go` and any struct moved out of `types.generated.go`. Never hand-edit `types.generated.go`.
        6. **Never reward-hack `TestMissingRefs`.** Never delete, truncate or reword proto doc comments (such as `"Format: projects/{project}/..."`) to silence it, and never add lines to `tests/apichecks/testdata/exceptions/missingrefs.txt`.
        7. **`untriaged-bulk-generation` goes last.** Keep it `open` while you work. Resolve it only after every other entry and the audit in section 4.

        ## 1. Inventory

        1. Read `{{ .Params.kind }}`'s block in `apis/<group>/judgement_queue.yaml`, plus `apis/<group>/generate.sh` and `apis/<group>/v1alpha1/<kind_lowercase>_types.go`.
        2. Check that `generate.sh` runs, in order:
           - `generate-types --prepopulate-resource`
           - `generate-identity`
           - `generate-mapper --prepopulate-resource` (plus `--multiversion` if the group has `v1alpha1` and `v1beta1`, and `--proto-source-path ${PROTO_OUT}` if the script pins a custom `PROTO_SHA`)
           - `generate-controller --prepopulate-resource` and `generate-fuzzer --prepopulate-resource`, if a pre-generated controller/fuzzer exists for `{{ .Params.kind }}`
           - `cd ${REPO_ROOT}`, `dev/tasks/generate-crds`, `goimports`

           In shared or legacy packages (e.g. `dialogflow`, `iam`, `mapmanagement`, `networkconnectivity`, `bigqueryanalyticshub`), if `generate-mapper` would overwrite existing mockgcp, legacy or multi-service mappers in `pkg/controller/direct/<group>/mapper.generated.go`, keep `{{ .Params.kind }}`'s mappers in `pkg/controller/direct/<group>/<kind_lowercase>_mapper.go` instead. The exact `<kind_lowercase>_` prefix satisfies `TestDirectResourceFileNaming`.
