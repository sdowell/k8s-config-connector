# Issue graph for onboarding a KCC greenfield resource Kind to a
# production-ready direct controller at v1alpha1.
#
# Replaces .agents/workflows/kcc-greenfield.txt (an LLM-driven
# `mode: workflow`). The factory watch graph reconciler opens one sub-issue
# per step, in order, as the previous one closes; no orchestrator sandbox,
# journal branch or precondition script is involved. See
# https://github.com/gke-labs/gemini-for-kubernetes-development/blob/main/factory/design/issue-graph.md
#
# Start a graph by filing a parent issue (trigger-labelled or assigned to
# the bot) whose body contains:
#
#   ```factory-graph
#   graph: kcc-greenfield
#   params:
#     kind: SpannerInstanceConfig
#   ```
#
# If the Kind is already prepopulated on master (it has an open
# `untriaged-bulk-generation` entry in apis/<service>/judgement_queue.yaml),
# use `graph: kcc-greenfield-prepopulated` instead. It starts at Step 1b, so no
# agent has to decide to skip Step 1a. Keep the steps the two files share in
# sync.
#
# Step bodies only name the skill to follow and pass on what only the graph
# knows (the Kind, earlier steps' issues). Everything else - preconditions
# ("already done" checks), validation, journaling, release notes - lives in
# the skills, so change the skill rather than adding instructions here. The
# skills route on the step/* labels set below.
#
# Validate changes with: factory graph validate .agents/graphs/kcc-greenfield.yaml
apiVersion: factory.gemini.google.com/v1alpha1
kind: IssueGraph
metadata:
  name: kcc-greenfield
  description: >-
    Drive a KCC greenfield resource Kind to a production-ready direct
    controller at v1alpha1: types and identity, controller and fuzzer,
    MockGCP, MockGCP/RealGCP alignment, then release.
spec:
  params:
    - name: kind
      description: CamelCase KCC Kind (for example SpannerInstanceConfig)
      pattern: '^[A-Z][A-Za-z0-9]{1,62}$'
      example: SpannerInstanceConfig

  # One step at a time: each step builds on the previous step's merged PR.
  maxActive: 1

  # The deployment's trigger label (overseer) is always added by the
  # reconciler; a step's `review` adds the review label (overseer/review).
  defaults:
    labels: [greenfield]

  steps:
    # Step 1a. Only for Kinds not yet prepopulated on master; the others use
    # kcc-greenfield-prepopulated.
    - id: prepopulate
      title: 'Greenfield: Prepopulate direct KRM types, identity, and judgement queue for {{ .Params.kind }}'
      labels: [step/gen-types]
      review: |
        Use .gemini/skills/reviewgen-greenfield-new-types/SKILL.md to conduct the review.
      body: |
        Follow `.gemini/skills/kcc-direct-greenfield-types-implementer/SKILL.md` (Step 1a) for {{ .Params.kind }}.

    # Step 1b.
    - id: types-judgement
      after: [prepopulate]
      title: 'Greenfield: Triage judgement queue and finalize direct KRM types and identity for {{ .Params.kind }}'
      labels: [step/types-judgement]
      review: |
        Use .gemini/skills/reviewgen-greenfield-new-types/SKILL.md to conduct the review.
      body: |
        Follow `.gemini/skills/kcc-direct-greenfield-types-implementer/SKILL.md` (Step 1b) for {{ .Params.kind }}.

    # Step 2.
    - id: controller
      after: [types-judgement]
      title: 'Greenfield: Implement direct controller, E2E fixtures, and fuzzer for {{ .Params.kind }}'
      labels: [step/controller]
      review: |
        Use .gemini/skills/reviewgen-greenfield-controller/SKILL.md to conduct the review.
      body: |
        Follow `.gemini/skills/kcc-direct-controller-logic-greenfield-implementer/SKILL.md` for {{ .Params.kind }}.

    # Step 3.
    - id: mockgcp
      after: [controller]
      title: 'Greenfield: Implement MockGCP and Alignment for {{ .Params.kind }}'
      labels: [step/mockgcp]
      review: |
        Use .gemini/skills/reviewgen-greenfield-mockgcp/SKILL.md to conduct the review.
      body: |
        Follow `.gemini/skills/kcc-direct-mockgcp-implementer/SKILL.md` for {{ .Params.kind }}.

        The direct controller and E2E fixtures were added in #{{ (step "controller").Issue }}.

    # Step 4.
    - id: mockgcp-alignment
      after: [mockgcp]
      title: 'Greenfield: Align MockGCP logs with RealGCP for {{ .Params.kind }}'
      labels: [step/mockgcp-alignment]
      review: |
        Use .gemini/skills/reviewgen-greenfield-mockgcp/SKILL.md to conduct the review.
      body: |
        Follow `.gemini/skills/match-mockgcp-with-realgcp/SKILL.md` for {{ .Params.kind }}.

        MockGCP for {{ .Params.kind }} was implemented in #{{ (step "mockgcp").Issue }}.

  # Created once every other step is done: ships the Kind.
  finally:
    title: 'Greenfield: Release {{ .Params.kind }} (remove it from BLOCKED_KINDS)'
    labels: [step/release]
    review: |
      Use .gemini/skills/reviewgen-greenfield-release/SKILL.md to conduct the review.
    body: |
      Follow `.gemini/skills/kcc-direct-greenfield-release/SKILL.md` for {{ .Params.kind }}.
