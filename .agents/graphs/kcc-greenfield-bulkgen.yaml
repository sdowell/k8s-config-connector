# Issue graph for onboarding a KCC greenfield resource Kind to a
# production-ready direct controller at v1alpha1 using the bulkgen pipeline.
#
# Self-contained variant of .agents/graphs/kcc-greenfield.yaml for the
# deterministic bulkgen (`controllerbuilder --prepopulate-resource`) pipeline.
# Child issues use expanded, self-contained bodies inlining all standards,
# guardrails, generation scripts, and review checklists.
#
# Start a graph by filing a parent issue (trigger-labelled or assigned to
# the bot) whose body contains:
#
#   ```factory-graph
#   graph: kcc-greenfield-bulkgen
#   params:
#     kind: SpannerInstanceConfig
#   ```
#
# Validate changes with: factory graph validate .agents/graphs/kcc-greenfield-bulkgen.yaml
apiVersion: factory.gemini.google.com/v1alpha1
kind: IssueGraph
metadata:
  name: kcc-greenfield-bulkgen
  description: >-
    Drive a KCC greenfield resource Kind to a production-ready direct
    controller at v1alpha1: prepopulate, judgement queue triage, direct
    controller and fuzzer with real-GCP fixtures, MockGCP, MockGCP/RealGCP
    alignment, and graduation out of BLOCKED_KINDS, using self-contained
    expanded step instructions.
spec:
  params:
    - name: kind
      description: CamelCase KCC Kind (for example SpannerInstanceConfig)
      pattern: '^[A-Z][A-Za-z0-9]{1,62}$'
      example: SpannerInstanceConfig

  # One step at a time: each step builds on the previous step's merged PR.
  maxActive: 1

  # The deployment's trigger label (overseer) is always added by the
  # reconciler; a step's `review` adds the review label (overseer/review).
  defaults:
    labels: [greenfield]

  steps:
    # -------------------------------------------------------------------------
    # Step 1a: Prepopulate Direct API Types, Identity, and Judgement Queue
    # -------------------------------------------------------------------------
    - id: prepopulate
      title: 'Greenfield: Prepopulate direct KRM types, identity, and judgement queue for {{ .Params.kind }}'
      labels: [step/gen-types]
      review: |
        Check every item, then post the result in the format at the end.

        1. **`generate.sh`.** It runs, in order: `generate-types` (`--resource {{ .Params.kind }}:<ProtoMessage>`, `--prepopulate-resource`); `generate-identity` (`--resource {{ .Params.kind }}:<ProtoMessage>`); `generate-mapper` after all types/identity calls (`--prepopulate-resource`, plus `--multiversion` if the group has `v1alpha1` and `v1beta1`); then `cd ${REPO_ROOT}`, `dev/tasks/generate-crds` and `goimports` on `pkg/controller/direct/<group>/`. No `--allow-non-ga-proto` unless this issue authorized it. Files are under `apis/<group>/v1alpha1/`. New `.go` and `.sh` files have a 2026 copyright header.
        2. **Queue still open.** `apis/<group>/judgement_queue.yaml` is committed with `untriaged-bulk-generation` / `status: open` for `{{ .Params.kind }}`. Reject if any `{{ .Params.kind }}` entry was resolved or deleted.
        3. **Pure generator output.** Re-running `./apis/<group>/generate.sh` and then `git diff --exit-code` shows no change to `<kind_lowercase>_types.go`, `types.generated.go`, `<kind_lowercase>_identity.generated.go`, `<kind_lowercase>_reference.generated.go`, `pkg/controller/direct/<group>/mapper.generated.go`, or the CRD under `config/crds/resources/`. Reject hand edits to those files; the recursive-type markers of section 4.3 are the only exception. Allowed compile fixes: the client library in `go.mod`/`go.sum`, extra proto packages on `generate-mapper --service`, small hand-written mapper helpers in `pkg/controller/direct/<group>/`, versioned-caller updates for `--multiversion`.
        4. **Blocklist.** `{{ .Params.kind }}` is in `BLOCKED_KINDS` in `dev/tasks/build-release-bundle` (4-space indent, double quotes, alphabetical, no duplicates).
        5. **Builds and checks.** These pass:
           ```bash
           go build ./apis/<group>/... ./pkg/controller/direct/<group>/...
           go test -v ./apis/<group>/... ./pkg/controller/direct/<group>/...
           go test -v ./tests/apichecks/...
           . dev/tasks/setup-envtest && go test ./pkg/cli/preview/... -run TestPreview
           go test ./operator/pkg/controllers/configconnector/...
           ```
        6. **Exception files.** Only `alpha-missingfields.txt`, `refs_not_representable.txt`, `spec_dislike_etag.txt`, `sensitive.txt`, `comments.txt`, `recursivetypes.txt`, and empty-oneof `knownInvalidCRDs` entries (with the `// GCP known pattern: Empty oneof option (...)` comment) may change. Reject any change to `missingrefs.txt`, `naming_violations.txt` or `multi_version_crd_diff/`.

        ```markdown
        ### KCC Greenfield Step 1a (Prepopulate) Auto-Review Results
        * **`generate.sh` & Flags Check**: [Pass/Fail] - (generate-types & generate-mapper with --prepopulate-resource, generate-identity, order, no --allow-non-ga-proto)
        * **Judgement Queue Open Check**: [Pass/Fail] - (untriaged-bulk-generation open; nothing resolved or deleted)
        * **Mechanical Output & Idempotency**: [Pass/Fail] - (zero diff after re-running generate.sh; no hand edits)
        * **Release Bundle Blocklist (`BLOCKED_KINDS`)**: [Pass/Fail]
        * **Mapper Compilation & `apichecks`**: [Pass/Fail] - (builds; tests pass; no unauthorized exception edits)

        #### Detailed Findings / Actions Required:
        1. [file, line, exact issue]
        ```
        <!-- end kcc-greenfield-bulkgen:step-1a -->
      body: |
        <!-- kcc-greenfield-bulkgen:step-1a -->
        **Kind:** `{{ .Params.kind }}` | **Step 1a: Prepopulate** (pipeline: **1a** → 1b → 2 → 3 → 4 → 5)

        > [!NOTE]
        > This issue is self-contained: it inlines every KCC skill this step needs, so you don't need to open anything under `.gemini/skills/`. If a skill, a doc under `docs/`, or `GEMINI.md` disagrees with this issue, follow this issue.

        Step 1a scaffolds `{{ .Params.kind }}` mechanically with `controllerbuilder`: KRM types, identity, reference, mapper and CRD. The generator also writes `apis/<group>/judgement_queue.yaml`, the list of decisions it couldn't make. **You make none of those decisions here**; Step 1b triages the queue.

        ## Values you need

        | Value | Meaning | How to find it |
        |---|---|---|
        | `<group>` | Group prefix. Types live in `apis/<group>/v1alpha1/`, the API group is `<group>.cnrm.cloud.google.com`, controllers live in `pkg/controller/direct/<group>/`. | If `apis/<group>/` already has kinds with the same prefix as `{{ .Params.kind }}`, reuse it. Otherwise use the lowercase service name from the proto package (`google.cloud.apihub.v1` → `apihub`). |
        | `<proto.package>` | Proto package, e.g. `google.cloud.apihub.v1`. | Section 1. |
        | `<ProtoMessage>` | Proto message of the resource, e.g. `Plugin`. | Usually `{{ .Params.kind }}` without the group prefix. Confirm with `grep -i <name> docs/ai/metadata/cloudassetinventory_names.jsonl` and the proto. |
        | `<service_name>` | Short GCP service name, as in `<service_name>.googleapis.com`. Used for the journal. | The proto's `option (google.api.default_host)`. |

        ## Guardrails

        - **Already done?** Run `git fetch origin master`, then both `git grep -n "kind: {{ .Params.kind }}$" origin/master -- 'apis/*/judgement_queue.yaml'` and `git grep -n "^type {{ .Params.kind }} struct" origin/master -- 'apis/'`. A hit on either means `{{ .Params.kind }}` was already bulk-prepopulated or finalized by a legacy PR, so don't open a PR (re-running `--prepopulate-resource` would overwrite hand-finalized types). Comment what you found on this issue and close it as **not planned** (`gh issue close <this issue's number> --reason "not planned" --comment "<what you found>"`); the overseer then moves on to Step 1b. If you can't close it, leave the comment and stop.
        - **No hand edits** to `<kind_lowercase>_types.go`, `types.generated.go`, `<kind_lowercase>_identity.generated.go`, `<kind_lowercase>_reference.generated.go` or `apis/<group>/judgement_queue.yaml`. (Section 4.3 has the one exception.)
        - **Resolve no queue entries.** `untriaged-bulk-generation` for `{{ .Params.kind }}` must stay `status: open`.
        - **No `--allow-non-ga-proto`.** If the resource only exists in a non-GA proto (`v1alpha*`, `v1beta*`), stop and comment on this issue.
        - **Stay in scope.** Touch only `{{ .Params.kind }}`'s files and the shared files named below. Don't refactor other resources.
        - **Don't edit any `SKILL.md`.** Put general learnings in the PR's "Workflow feedback" section.

        ## 1. Find the proto (GA only)

        1. If `.build/third_party/googleapis` is missing, run `./dev/tools/controllerbuilder/generate-proto.sh`.
        2. Find the message: `grep -rn "^message <ProtoMessage> {" .build/third_party/googleapis/google/`.
        3. Confirm the package is GA (`v1`, `v2`, `v4`, …). Note its `option (google.api.resource)` pattern(s) and `Create<ProtoMessage>Request`.

        ## 2. Configure `apis/<group>/generate.sh`

        If the group is new, create the script; otherwise add `{{ .Params.kind }}` to it. `generate-types` and `generate-mapper` get `--prepopulate-resource`; `generate-identity` has no such flag:

        ```bash
        #!/bin/bash
        # Copyright 2026 Google LLC
        #
        # Licensed under the Apache License, Version 2.0 (the "License");
        # you may not use this file except in compliance with the License.
        # You may obtain a copy of the License at
        #
        #      http://www.apache.org/licenses/LICENSE-2.0
        #
        # Unless required by applicable law or agreed to in writing, software
        # distributed under the License is distributed on an "AS IS" BASIS,
        # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        # See the License for the specific language governing permissions and
        # limitations under the License.

        set -o errexit
        set -o nounset
        set -o pipefail

        REPO_ROOT="$(git rev-parse --show-toplevel)"

        CONTROLLERBUILDER="${CONTROLLERBUILDER:-}"
        if [[ -z "${CONTROLLERBUILDER}" ]]; then
          if [[ -x "${REPO_ROOT}/bin/controllerbuilder" ]]; then
            CONTROLLERBUILDER="${REPO_ROOT}/bin/controllerbuilder"
          else
            CONTROLLERBUILDER="go run ${REPO_ROOT}/dev/tools/controllerbuilder"
          fi
        fi
        source "${REPO_ROOT}/dev/tools/goimports.sh"
        cd ${REPO_ROOT}/dev/tools/controllerbuilder
        ./generate-proto.sh

        ${CONTROLLERBUILDER} generate-types \
          --service <proto.package> \
          --api-version <group>.cnrm.cloud.google.com/v1alpha1 \
          --include-skipped-output \
          --resource {{ .Params.kind }}:<ProtoMessage> \
          --prepopulate-resource

        ${CONTROLLERBUILDER} generate-identity \
          --service <proto.package> \
          --api-version <group>.cnrm.cloud.google.com/v1alpha1 \
          --resource {{ .Params.kind }}:<ProtoMessage>

        ${CONTROLLERBUILDER} generate-mapper \
          --service <proto.package> \
          --api-version <group>.cnrm.cloud.google.com/v1alpha1 \
          --include-skipped-output \
          --prepopulate-resource

        cd ${REPO_ROOT}
        if [[ -z "${SKIP_GENERATE_CRDS:-}" ]]; then
          dev/tasks/generate-crds
        fi

        if [ -d "${REPO_ROOT}/pkg/controller/direct/<group>" ]; then
          go run -mod=readonly golang.org/x/tools/cmd/goimports@${GOLANG_X_TOOLS_VERSION} -w pkg/controller/direct/<group>/
        fi
        ```

        - **Order.** Every `generate-types` and `generate-identity` call comes before `generate-mapper`, followed by `cd ${REPO_ROOT}`, `dev/tasks/generate-crds` and `goimports`. In an existing script, insert the new blocks **above** `generate-mapper`, never below it; otherwise the mapper is generated before `types.generated.go` is updated.
        - **Groups with `v1beta1` kinds.** Pass `--multiversion` and `--prepopulate-resource` to the single `generate-mapper` call, targeting `<group>.cnrm.cloud.google.com/v1beta1`.
        - `--prepopulate-resource` already turns on the bulk-generation options (`--emit-plural-acronyms`, `--emit-message-maps`) in `generate-types` and `generate-mapper`. Don't add them yourself.

        ## 3. Generate, block the kind from releases, and compile

        1. Run the script:
           ```bash
           chmod +x apis/<group>/generate.sh
           ./apis/<group>/generate.sh
           ```
        2. **`BLOCKED_KINDS`.** Add `{{ .Params.kind }}` to the `BLOCKED_KINDS=( ... )` array in `dev/tasks/build-release-bundle`: 4-space indent, double quotes (`    "{{ .Params.kind }}"`), alphabetical order, no duplicates. This keeps the unverified CRD out of the release bundle (`operator/channels/packages/configconnector/*/crds.yaml`) until Step 5 (graduation) removes it at the end of the pipeline.
        3. **New API group?** If `dev/tasks/generate-crds` added the group to `config/installbundle/components/clusterroles/cnrm_admin.yaml` or `cnrm_viewer.yaml`, keep the operator files in sync:
           ```bash
           ./dev/tasks/generate-channels
           WRITE_GOLDEN_OUTPUT=1 go test ./operator/pkg/controllers/configconnector/...
           ```
        4. Check that `apis/<group>/judgement_queue.yaml` exists and has `reason: untriaged-bulk-generation` with `status: open` for `{{ .Params.kind }}`.
        5. Compile:
           ```bash
           go build ./apis/<group>/... ./pkg/controller/direct/<group>/...
           ```
        6. If `pkg/controller/direct/<group>/` doesn't compile, make **only** these minimal fixes. Never edit `<kind_lowercase>_types.go` or the queue to fix compilation.
           - **Missing Go client library:** `go get cloud.google.com/go/<service_name>/apiv<N>/<service_name>pb && go mod tidy` (`<N>` is the proto package's major version), then `(cd mockgcp && go mod tidy)` (or `make ensure`) so `validate-ensure` passes.
           - **Missing external proto mappers** (`Money_FromProto`, `LatLng_FromProto`, `Expr_FromProto`, …): append `,google.type` (or the right package) to `--service` on `generate-mapper` and re-run `generate.sh`.
           - **Missing helpers for `*Request` / `*Metadata` messages or wrapper types:** add a small hand-written `<kind_lowercase>_mapper.go` (or `mapper.go`) in `pkg/controller/direct/<group>/` with only the missing `*_FromProto` / `*_ToProto` functions. The `<kind_lowercase>_` prefix keeps `TestDirectResourceFileNaming` from flagging it.
           - **Existing `v1beta1` controllers broken by `--multiversion`:** switch their callers to the versioned `*_v1beta1_FromProto` / `*_v1beta1_ToProto` functions (or the new `URIs` acronym casing).

        ## 4. Idempotency and API checks

        1. Re-run `./apis/<group>/generate.sh`. It must leave no new diff.
        2. Run:
           ```bash
           go test ./apis/<group>/... ./pkg/controller/direct/<group>/...
           go test ./tests/apichecks/...
           . dev/tasks/setup-envtest && go test ./pkg/cli/preview/... -run TestPreview
           go test ./operator/pkg/controllers/configconnector/...
           ```
           - While `untriaged-bulk-generation` is open, `TestMissingRefs`, `TestDescriptions`, `TestFieldNames`, `TestRequiredFields` and `TestCRDBackwardCompatibility` skip `{{ .Params.kind }}`.
           - `WRITE_GOLDEN_OUTPUT=1 go test ./tests/apichecks/...` may add untriaged lines for `{{ .Params.kind }}` to `alpha-missingfields.txt`, `refs_not_representable.txt`, `spec_dislike_etag.txt`, `sensitive.txt`, `comments.txt` and `recursivetypes.txt`. That's expected. Revert any formatting churn under `tests/apichecks/testdata/exceptions/multi_version_crd_diff/`.
           - **Never** modify `tests/apichecks/testdata/exceptions/missingrefs.txt`, `naming_violations.txt` or anything under `tests/apichecks/testdata/exceptions/multi_version_crd_diff/`.
        3. **Recursive protos.** If `recursivetypes.txt` or envtest (`pkg/cli/preview`) flags a recursive message cycle where `controller-gen` emits an empty `{}` schema, add `+kubebuilder:validation:Schemaless`, `+kubebuilder:validation:XPreserveUnknownFields` (`+kubebuilder:validation:items:XPreserveUnknownFields` for slices) and `+kubebuilder:validation:Type=object` on the cycle-edge field in `<kind_lowercase>_types.go`, then re-run `./dev/tasks/generate-crds`. This is the only hand edit to `_types.go` allowed in Step 1a; call it out in the PR.
        4. **Empty oneof variants.** If `TestCRDObjectTypes` fails with `field ... is an object with no properties` on a genuinely parameterless proto `oneof` variant (e.g. `message LlmAgent {}`), add the CRD plural to `knownInvalidCRDs` in `tests/apichecks/crds_test.go` with the comment `// GCP known pattern: Empty oneof option (<field path>)`.
        5. Run `scripts/validate-prereqs.sh`. It runs fmt/generate/manifests and fails on any unstaged diff; its output includes hints for fixing errors. Commit again if it changes files.

        ## Done when

        - `apis/<group>/generate.sh` has `generate-types --prepopulate-resource`, `generate-identity` and `generate-mapper --prepopulate-resource` in the right order, and re-running it leaves no diff.
        - `judgement_queue.yaml` has `{{ .Params.kind }}`'s `untriaged-bulk-generation` entry with `status: open`; no `{{ .Params.kind }}` entry was resolved or deleted.
        - `{{ .Params.kind }}` is in `BLOCKED_KINDS`.
        - Everything in sections 3 and 4 builds and passes, including `scripts/validate-prereqs.sh`.

        ## Journal

        Write service-specific quirks to `.gemini/journals/<service_name>.md` (create it if needed). Never write to a `journal/` folder or `journal.md` under `.gemini/skills/`. Use this format:

        ```markdown
        ### [YYYY-MM-DD] <Brief title>
        - **Context**: <what you were implementing; kind/PR>
        - **Problem**: <the unexpected behavior>
        - **Solution**: <how you solved it; snippets if useful>
        - **Impact**: <why the next agent should care>
        ```

        ## Pull request

        - **Title:** `Greenfield: Prepopulate direct KRM types, identity, and judgement queue for {{ .Params.kind }}`
        - **Labels:** the labels on this issue.
        - **Push and open it** with `./dev/tasks/validate-and-push origin <branch>` (it runs the presubmits and pushes only if they pass), then `./.gemini/skills/send-pr/scripts/send-pr.sh --title "<title>" --body <file> --labels "<labels>"`. Write the body to a temp file outside the repo and never commit it.
        - **Body:** `Fixes #<this issue's number>`; the checks you ran and their results; any minimal compile fix or `_types.go` edit and why; the journal entries you wrote (paths); and a `## Workflow feedback` section listing anything in this issue that was unclear, wrong or missing. End it with this release-note block:

        ```release-note
        NONE
        ```

    # -------------------------------------------------------------------------
    # Step 1b: Triage Judgement Queue and Finalize Direct API Types
    # -------------------------------------------------------------------------
    - id: types-judgement
      after: [prepopulate]
      title: 'Greenfield: Triage judgement queue and finalize direct KRM types and identity for {{ .Params.kind }}'
      labels: [step/types-judgement]
      review: |
        Check every item, cross-checking against the proto in `.build/third_party/googleapis/google/...`, then post the result in the format at the end.

        1. **Queue complete and intact.**
           - No entry was deleted. `{{ .Params.kind }}`'s `untriaged-bulk-generation` is `resolved`, as is every other `{{ .Params.kind }}` entry and any legacy `protoMessage:` entry reachable from `{{ .Params.kind }}Spec` or `{{ .Params.kind }}ObservedState`. Only `well-known-proto-type` and `sensitive-field` may stay `open` (or be `deferred` with a note).
           - Reference entries for the same `(kind, group, field)` share one status. Every `edited`, `deferred` or `not-applicable` resolution has an accurate note.
           - No `+kcc:guess` markers remain in `<kind_lowercase>_types.go`, `<kind_lowercase>_identity*.go` or structs moved out of `types.generated.go`.
        2. **Resolutions are right.**
           - A field resolved as `not-applicable` or `accepted` that really references a control-plane GCP resource (KMS key, network, subnetwork, service account, project, dataset, bucket, Pub/Sub topic, Secret Manager secret, sibling resource) must be a `*Ref`. Data-plane objects KCC doesn't manage, such as Cloud Storage objects, may stay strings.
           - Reject any PR that deletes, truncates or rewords proto doc comments (e.g. `"Format: projects/{project}/..."`) to get past `TestMissingRefs`.
           - An output-only field resolved as `not-applicable` must really be user-settable on Create/Update; otherwise it belongs in `ObservedState`. `empty-observedstate` was fixed by moving fields or by commenting out the empty ObservedState. `etag` is never in a spec struct.
        3. **Parent, identity and references** (against `option (google.api.resource)` and `Create<ProtoMessage>Request`).
           - **Top-level resources** (the parent pattern is `projects/{project}`, `folders/{folder}` or `organizations/{organization}`, optionally plus `locations/{location}`) keep the root reference plus `location`. A project+location parent is an embedded `*parent.ProjectAndLocationRef` with `json:",inline"`, not separate `ProjectRef` and `Location` fields; its `Location string` is not a pointer violation. A global resource has no `Location`. A multi-root resource has optional `ProjectRef`/`FolderRef`/`OrganizationRef` and an identity that accepts every root.
           - **Child resources** (the parent pattern ends in another resource) have exactly one hierarchy field, `ParentRef *<ParentKind>Ref` with `json:"parentRef"`, marked `+required` and carrying the `self == oldSelf` CEL immutability rule. No `projectRef`, `folderRef`, `organizationRef`, `location`, `region`, `zone` or grandparent reference anywhere in the spec, no `json:",inline"` on it, and no other `parent<Something>Ref` field. The identity takes project, location and ancestor IDs only from the resolved `spec.parentRef` (no `refs.ResolveProjectID`, `refs.GetLocation` or annotations).
           - **The `parentRef` name is intentional** (single-parent design; `TestCRDsHaveParentRefs` is skipped on master for greenfield parent refs). Don't ask to rename it after the parent kind. Fail the PR if it adds lines to `crds_have_parent_refs.txt` or changes `TestCRDsHaveParentRefs`.
           - `generate.sh` runs `generate-identity`. Hand-written identity/reference code appears only where the generator can't express the pattern. Singleton templates keep the literal suffix.
           - `{{ .Params.kind }}Identity` is `ServerGeneratedIdentity` exactly when `Create<ProtoMessage>Request` has no `<resource>_id` field; otherwise `IdentityV2`.
           - Every new `<TargetKind>Ref` lives in its own `<targetkind>_reference*.go` with a matching identity file, never in `_types.go` or under `apis/refs/v1beta1/`. No new ref type duplicates one that already exists elsewhere in `apis/` (check with `git grep "type <TargetKind>Ref struct" -- apis/`). Targets with a full CRD use `refs.Normalize` (never `NormalizeWithFallback`); external-only references validate `External`.
        4. **Proto-vs-KRM audit and struct isolation.**
           - `+kcc:spec:proto=` and `+kcc:observedstate:proto=` point at exactly `{{ .Params.kind }}`'s message, and no proto is shared by two kinds.
           - Flag any reference still typed `*string` / `[]string` anywhere reachable from `{{ .Params.kind }}Spec`, even without a queue entry.
           - Hand-written nested structs carry `// +kcc:proto=` and contain the proto message name. Structs shared with a triaged or pre-existing kind were forked under a distinct name, not changed in place. `TestCRDBackwardCompatibility` and `TestHandWrittenProtoStructAnnotationsAndNaming` pass.
           - Scalars are pointers (except the embedded parent `Location`), slices and maps are not, and an empty ObservedState is commented out.
        5. **Generated files, controller sync and exceptions.**
           - `{{ .Params.kind }}` is still in `BLOCKED_KINDS`.
           - `generate.sh` has `generate-mapper --prepopulate-resource` (plus `--multiversion` / `--proto-source-path` where needed), or `{{ .Params.kind }}`'s mappers are isolated in `<kind_lowercase>_mapper.go`. `types.generated.go`, the mappers, `zz_generated.deepcopy.go` and the CRD are in sync with `<kind_lowercase>_types.go`. `{{ .Params.kind }}Spec` has no top-level `Labels`.
           - **Gate:** if a controller or fuzzer already exists for `{{ .Params.kind }}`, it still builds (`go build ./pkg/controller/direct/<group>/...`) and passes `FOCUS={{ .Params.kind }} go test ./pkg/fuzztesting/fuzztests -run TestFocusedMappers`. If not, fail the review and ask for the controller and fuzzer to be regenerated with `generate-controller` / `generate-fuzzer --prepopulate-resource` and fixed.
           - Only `alpha-missingfields.txt`, `pkg/gcpurls/registry_test.go` (verified non-CAI templates) and `naming_violations.txt` (new external-only files) may grow. `missingrefs.txt` and `crds_have_parent_refs.txt` are untouched.

        ```markdown
        ### KCC Greenfield Step 1b (Judgement Queue) Auto-Review Results
        * **Judgement Queue Completeness**: [Pass/Fail] - (all {{ .Params.kind }} entries resolved, none deleted, no +kcc:guess left)
        * **Queue Resolution Accuracy**: [Pass/Fail] - (wrong not-applicable/accepted; etag or top-level labels in Spec; doc comments stripped)
        * **Parent, Identity & References**: [Pass/Fail] - (top-level: root ref + location / ProjectAndLocationRef; child: single required, immutable spec.parentRef; generate-identity; singleton/multi-pattern templates; ServerGeneratedIdentity vs IdentityV2; refs.Normalize)
        * **Unflagged Proto-vs-KRM Audit & Struct Isolation**: [Pass/Fail] - (unflagged refs; missing +kcc:proto; shared structs mutated; non-pointer scalars; empty ObservedState)
        * **Generated Files, Controller/Fuzzer Sync & `BLOCKED_KINDS`**: [Pass/Fail] - (CRD/mapper/deepcopy in sync; pre-existing controller/fuzzer regenerated and passing; BLOCKED_KINDS; missingrefs.txt untouched)

        #### Detailed Findings / Actions Required:
        1. [file, line, exact issue]
        ```
        <!-- end kcc-greenfield-bulkgen:step-1b -->
      body: |
        <!-- kcc-greenfield-bulkgen:step-1b -->
        **Kind:** `{{ .Params.kind }}` | **Step 1b: Judgement triage** (pipeline: 1a → **1b** → 2 → 3 → 4 → 5)

        > [!NOTE]
