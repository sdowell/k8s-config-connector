        ## 2. Parent, location and identity entries

        Reasons: `location-or-parent-ref`, `parent-ref-guessed`, `parent-ref-not-modelled`, `parent-ref-not-supported`, `parent-multiple-patterns`, `location-parent-unknown`, `parent-root-unknown`, `root-not-in-name`, `root-ref-guessed`, `root-ref-not-modelled`, `identity-multi-pattern`, `identity-root-unknown`, `identity-not-in-cai`, `identity-server-generated-id`.

        **The single-parent rule.** First find the parent pattern: the resource's `option (google.api.resource)` pattern without its last `/<collection>/{id}` pair. For example, `projects/{project}/locations/{location}/agents/{agent}/webhooks/{webhook}` has the parent `projects/{project}/locations/{location}/agents/{agent}`. It is also the `parent` of `Create<ProtoMessage>Request`. Then:

        - **Top-level resource:** the parent pattern is just a root (`projects/{project}`, `folders/{folder}` or `organizations/{organization}`), optionally followed by `locations/{location}`. Keep the root reference plus `location` (cases A and C).
        - **Child resource:** the parent pattern ends in another resource. Model it with exactly one field, `spec.parentRef` (case B).

        For this one field, the rule overrides `docs/develop-resources/api-conventions/validations.md` Rule 3 (an inlined `Parent` struct) and the convention that a reference is named after its target kind.

        **Case A: top-level, project and location** (`projects/{project}/locations/{location}/<collection>/{id}`; the `location-or-parent-ref` detail mentions `parent.ProjectAndLocationRef`).
        1. In `<kind_lowercase>_types.go`, import `parent "github.com/GoogleCloudPlatform/k8s-config-connector/apis/common/parent"`.
        2. Replace the separate `ProjectRef *refsv1beta1.ProjectRef` and `Location` fields on `{{ .Params.kind }}Spec` with:
           ```go
           *parent.ProjectAndLocationRef `json:",inline"`
           ```
           It defines `ProjectRef` (`+required`) and `Location string` (`+required`, immutable). That non-pointer `Location` is an approved exception to the pointer rule. The CRD keeps `spec.projectRef` and `spec.location`.
        3. Re-run `./apis/<group>/generate.sh` so `generate-identity` regenerates `<kind_lowercase>_identity.generated.go` and `<kind_lowercase>_identity_generated_test.go`.
        4. Resolve `location-or-parent-ref` as `edited`, note `replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef`.

        Other top-level parents keep the generated root field: `projects/{project}` keeps `ProjectRef *refsv1beta1.ProjectRef` and has no `Location`; `folders/{folder}` or `organizations/{organization}` keeps `FolderRef *refsv1beta1.FolderRef` or `OrganizationRef *refsv1beta1.OrganizationRef`, plus `Location` if the parent pattern has `locations/{location}`. All of them are required.

        **Case B: child resource, `spec.parentRef`** (`.../<parents>/{parent}/<collection>/{id}`; `parent-ref-guessed`, `parent-ref-not-modelled`, `parent-ref-not-supported`, or a `location-or-parent-ref` saying the parent "already names the location").
        1. **Find the parent's reference type.** Search the whole repo: `git grep -n "type <ParentKind>Ref struct" -- apis/`. The generator only looks in `{{ .Params.kind }}`'s own package, so `parent-ref-not-modelled` can appear even when the ref exists in another version or group package (e.g. `apis/<group>/v1beta1/`). Use it if it exists; never create a second ref type for the same kind, and don't change the parent's CRD schema. If none exists: for a parent in the same proto service, generate its identity and reference with `controllerbuilder generate-identity`; otherwise add `<parentkind>_identity.go` and an external-only `<parentkind>_reference.go` (section 5.4).
        2. **Replace** `ProjectRef`, `Location` and any guessed `<Parent>Ref` field on `{{ .Params.kind }}Spec` with exactly this field:
           ```go
           // The <ParentKind> this {{ .Params.kind }} is created under.
           // +required
           // +kubebuilder:validation:XValidation:rule="self == oldSelf",message="parentRef is immutable"
           ParentRef *<ParentKind>Ref `json:"parentRef"`
           ```
           - It is the only hierarchy field: no `projectRef`, `folderRef`, `organizationRef`, `location`, `region`, `zone` or reference to a grandparent anywhere in the spec.
           - Never put `json:",inline"` on it. The Go name `ParentRef` and the JSON name `parentRef` are used only for this field, and no other field is named `parent<Something>Ref`.
           - Project, location and every ancestor ID come from the parent once the reference is resolved, never from the `cnrm.cloud.google.com/project-id` annotation, the namespace, `refs.ResolveProjectID` or `refs.GetLocation`.
           - If the proto message has its own `parent` field, don't add a spec field for it; the controller fills it from the identity.
        3. **Regenerate.** Re-run `./apis/<group>/generate.sh`. `generate-identity` recognizes a field named `parentRef`: the generated `getIdentityFrom{{ .Params.kind }}Spec` normalizes `spec.parentRef` and builds the identity from the parent's external reference plus the resource ID. This also resolves `identity-root-unknown`. Check that the generated function reads nothing from the spec except `parentRef` and `resourceID`.
        4. **`TestCRDsHaveParentRefs`.** It flags reference fields whose name starts with `parent`, but it is skipped on master because greenfield parent refs are allowed. Don't add lines to `tests/apichecks/testdata/exceptions/crds_have_parent_refs.txt`, don't un-skip or edit the test, and don't rename the field after the parent kind, even if a review asks; point to this issue instead. (If the test is ever un-skipped on master, commit the one line `WRITE_GOLDEN_OUTPUT=1 go test ./tests/apichecks/ -run TestCRDsHaveParentRefs` writes for `{{ .Params.kind }}`'s CRD, and nothing else.)
        5. **Resolve** the `parent-ref-*`, `location-or-parent-ref` and `identity-root-unknown` entries as `edited`, note `modelled as spec.parentRef (*<ParentKind>Ref) per the single-parent rule; removed projectRef and location`.
        6. **Stop and comment on this issue** instead of improvising if:
           - the resource has several name patterns whose parents are different kinds: there is no shared multi-kind reference type yet; or
           - no KCC kind, direct or legacy, can create the parent: Step 2's fixtures must create it, so the parent kind has to be implemented first. (A parent that KCC manages only through a legacy kind is fine: give it an external-only reference type as in item 1.)

        **Case C: global, several roots, or proto `location`/`region`/`zone` fields.**
        - `location-parent-unknown`: if the pattern has no `{location}` segment, remove `Location` from `{{ .Params.kind }}Spec`, re-run `generate.sh`, and resolve as `edited`.
        - `location-or-parent-ref` on a proto `location`, `region` or `zone` field that is not the parent (top-level or nested): decide whether it names a Compute region/zone or sub-resource, or is a plain region/zone parameter (e.g. `StorageRapidCache.spec.zone`, `CloudSqlSettings.zone`). Convert it to a reference if that fits (`edited`), or keep the string (`accepted`, with a note).
        - `parent-multiple-patterns`, `parent-root-unknown`, `root-not-in-name`, `root-ref-*` on a **top-level** resource that can live under several roots (`projects/...`, `folders/...`, `organizations/...`): add an optional (`// +optional`) `ProjectRef *refsv1beta1.ProjectRef`, `FolderRef *refsv1beta1.FolderRef` and/or `OrganizationRef *refsv1beta1.OrganizationRef` for each supported root. Re-run `generate.sh` (it generates the multi-parent identity) and resolve as `edited`. For a child resource, see case B, item 6.

        **Identity entries.** `generate-identity` resolves `identity-*` entries itself once `{{ .Params.kind }}Spec` models every segment of the pattern and `generate.sh` is re-run.
        - `identity-root-unknown` / `identity-multi-pattern`: fix the parent/root fields as above and re-run `generate.sh`. If the proto has no `(google.api.resource)`, or several patterns, lock the pattern with `--pattern {{ .Params.kind }}=<pattern>` (or `--pattern {{ .Params.kind }}=//<host>/<pattern>`) on `generate-identity` rather than hand-writing the identity.
          - **Singletons** (the pattern ends in a literal, e.g. `projects/{project}/locations/{location}/config`): the template keeps the literal suffix, with no invented `{config}` variable. Remove `ResourceID` from `{{ .Params.kind }}Spec` if it doesn't apply.
        - `identity-not-in-cai`: check the `gcpurls.Template` host and path against the proto pattern (camelCase collection names) and `docs/ai/metadata/cloudassetinventory_names.jsonl`. `pkg/gcpurls/registry_test.go` skips templates that have this entry. If the template matches the proto, resolve as `accepted`, note `verified template against proto google.api.resource pattern`.
        - `identity-server-generated-id` (no `*_id` on `Create<ProtoMessage>Request`, or `.name` is `OUTPUT_ONLY`): read `Create<ProtoMessage>Request` (or `Insert<ProtoMessage>Request`).
          - **No `<resource>_id` field, and the server assigns the ID:** make sure the `ResourceID` comment in `{{ .Params.kind }}Spec` says it is server-generated, so `generate-identity` emits `identity.ServerGeneratedIdentity`. Resolve as `accepted`, or `edited` if you changed the spec and regenerated.
          - **Has a `<resource>_id` field** (even if `.name` is `OUTPUT_ONLY`), or takes the ID through `name`: `{{ .Params.kind }}Identity` must implement `identity.IdentityV2`. Resolve as `accepted` with a note that the request has `<resource>_id`, or `edited`.

        ## 3. Reference, output-only and required entries

        Reasons: `authoritative-proto-reference`, `possible-reference`, `possible-reference-by-description`, `possible-reference-by-description-loose`, `possible-reference-by-name`, `possible-reference-by-sibling`, `reference-not-representable`, `well-known-output-only-pattern-in-comment`, `possible-output-only-pattern-in-comment`, `required-not-enforced`.

        ### 3.1 Editing nested structs from `types.generated.go`

        Before a **breaking** edit to a nested struct (removing a field, converting a field to `*Ref`, adding `+required`), find every kind that uses it: `grep -rn "<Struct>" apis/<group>/`. Don't rely on the queue alone: pre-existing kinds have no entries, triaged kinds have `untriaged-bulk-generation` resolved, untriaged kinds have it open.

        - **Always keep `// +kcc:proto=<full.proto.MessageName>`** on every hand-written nested struct in `<kind_lowercase>_types.go` (and `// +kcc:proto:field=...` on its fields), and keep `<Struct>` in its Go name. `TestHandWrittenProtoStructAnnotationsAndNaming` enforces both.
        - **Non-breaking changes** from `generate.sh` (new optional fields, updated doc comments) are fine in place in `types.generated.go`.
        - **Used only by `{{ .Params.kind }}`** (or only by untriaged kinds you change together): move `type <Struct> struct` into `<kind_lowercase>_types.go` under its original name and edit it there. Don't move unmodified parent structs; the generator keeps them in `types.generated.go` and points them at your copy.
        - **Shared with another kind** (especially a pre-existing or triaged one): never change `type <Struct> struct` in place; that breaks the other kind's CRD and mappers (`TestCRDBackwardCompatibility`). Reuse a compatible hand-written variant, or fork the struct into `<kind_lowercase>_types.go` under a distinct name that still contains `<Struct>` (e.g. `{{ .Params.kind }}_<Struct>`, `<Struct>Spec` paired with `<Struct>ObservedState`, or the generated `<Struct>WithRequired`), keeping `+kcc:proto=`. The base struct stays generated for the other kinds. If an intermediate struct between `{{ .Params.kind }}Spec` and `<Struct>` is also shared, fork it too, keeping its `+kcc:proto=` and its name.

        ### 3.2 Reference entries

        `authoritative-proto-reference` means the proto field has a `google.api.resource_reference`; it is then the only finding for that field. Without one, a field can carry 2–3 heuristic `possible-reference-*` entries. Read all their `detail:` lines together with the proto field comment.

        - **The field references a GCP resource:**
          1. If it's in a nested struct, move or fork the struct per 3.1.
          2. Replace the `*string` / `[]string` with `<fieldName>Ref *<TargetKind>Ref`, or `[]<TargetKind>Ref` for lists (singular field name plus `Refs`, e.g. `datasets` → `DatasetRefs` with `json:"datasetRefs,omitempty"`). Keep `// +kcc:proto:field=...`.
          3. Remove its `// +kcc:guess=possible-reference` or `// +kcc:guess=sibling-ref`.
          4. If `<TargetKind>Ref` doesn't exist in `{{ .Params.kind }}`'s package, search the whole repo first (`git grep -n "type <TargetKind>Ref struct" -- apis/`); refs often live in another group or version package, and standard ones such as `ProjectRef` live in `apis/refs/v1beta1/`. Use an existing one if found. Only if none exists: for a target in the same proto service, generate it with `generate-identity`; otherwise add an external-only reference (section 5.4). **Never** add new files or types under `apis/refs/v1beta1/`. For targets with a full KCC CRD (`status.externalRef`), `Normalize` delegates to `refs.Normalize`, never `refs.NormalizeWithFallback`.
          5. Resolve the entry (or **all** of the field's `possible-reference*` entries) as `edited`, note `converted to <fieldName>Ref (*<TargetKind>Ref)`.

          Standard targets: service accounts → `IAMServiceAccount`, Cloud Storage buckets → `StorageBucket`, Service Directory → `ServiceDirectoryService`, projects → `refsv1beta1.ProjectRef`.
        - **The field is not a control-plane GCP resource** (an opaque or third-party ID, a display string, a CVE ID, a filter expression, a `*` wildcard, or a data-plane object KCC doesn't manage, such as a Cloud Storage object): remove any `+kcc:guess`, resolve as `not-applicable` with a note saying what the field holds, and check that `go test ./tests/apichecks/... -run TestMissingRefs` passes without touching doc comments or `missingrefs.txt`.
        - **`reference-not-representable`** (a polymorphic multi-kind name, or a format KCC can't type yet): confirm the reason in `detail` and resolve as `accepted` (or `edited` if one canonical reference applies).

        ### 3.3 Output-only fields named in comments

        `detail` gives the spec path and where the field would live under `status.observedState`. Check the proto comment.
        - **Server-populated:** move a top-level field from `{{ .Params.kind }}Spec` to `{{ .Params.kind }}ObservedState`. For a nested field, move or fork the struct per 3.1, drop the field from the spec struct, and make sure `<Struct>ObservedState` carries it under `{{ .Params.kind }}ObservedState`. Resolve as `edited`, note `moved output-only field from <spec_path> to <observed_state_path>`.
        - **User-settable** (e.g. "Output only for X mode, required for Y mode", or a false positive): keep it, and resolve as `not-applicable` with the reason.

        ### 3.4 `required-not-enforced`

        Follow `detail`. If a hand-written struct holds a generated `<Struct>` that has a `<Struct>WithRequired` copy, switch to `<Struct>WithRequired` (isolating the parent struct per 3.1 if it's shared with a non-strict kind). If a shared struct needs `+required` together with other edits, fork it per 3.1 and add `// +required` to the required fields. Resolve as `edited`.

        ### 3.5 Every other reason

        | `reason` | Action |
        |---|---|
        | `ambiguous-proto-name` | Qualify `--resource {{ .Params.kind }}:<full.proto.Package.ProtoName>` in `generate.sh`, check `+kcc:spec:proto=`, re-run `generate.sh`. `edited`. |
        | `empty-observedstate` | If server-populated output fields landed in `Spec`, move them to `{{ .Params.kind }}ObservedState`. If there really are none, comment out `ObservedState *{{ .Params.kind }}ObservedState` in `{{ .Params.kind }}Status` and `type {{ .Params.kind }}ObservedState struct`, so `TestCRDObjectTypes` passes. `edited`. |
        | `etag-in-spec` | Remove `Etag *string` from `{{ .Params.kind }}Spec` (or the nested spec struct, isolating it per 3.1 if shared) and make sure `Etag *string` is in `ObservedState`. `edited`. |
        | `possible-status-field-in-spec` | Check the flagged field (`state`, `status`, `createTime`, `updateTime`, `deleteTime`, `lastUpdateTime`, `creationTimestamp`, `startTime`, `endTime`, `uid`, `id`, `selfLink`, `selfLinkWithID`, `reconciling`). Server-populated: move it to `ObservedState` (`edited`). An `id`/`uid` that duplicates `spec.resourceID` or is server-generated: remove it from `Spec`, and put it in `ObservedState` if server-generated (`edited`). Genuinely user-set desired state, such as an admin toggle or a scheduled start/end window: keep it (`accepted`). |
        | `server-set-field-placed` | Confirm against the proto that it belongs in `ObservedState` and remove the `+kcc:guess`. `accepted` (or `edited` if you moved it back to `Spec`). |
        | `message-map-derived` | Check that the `map[string]<Struct>` field and its mapper helpers compile. `accepted`. |
        | `deprecated-field` / `deprecated-message` / `deprecated-resource` | Top-level deprecated fields are already omitted: `accepted`. `deprecated-message`: remove the field from `Spec` (per 3.1 if nested), `edited`. `deprecated-resource`: confirm intent, `accepted`. |
        | `verify-resource-docs-link` / `verify-service-docs-link` | Fix the doc URL in `<kind_lowercase>_types.go` to a valid `https://cloud.google.com/...` page (or remove it if there is none) and remove `// +kcc:guess=source-link`. `edited`. |
        | `unsupported-field-type` | Read the `// TODO: unsupported` comment. Map it to a standard KRM type (`edited`) or resolve as `deferred` with a note. |
        | `well-known-proto-type` / `sensitive-field` | Leave `open`, or `deferred` with a note. |

        ## 4. Audit before closing `untriaged-bulk-generation`

        1. **Unflagged references.** Scan every remaining `*string` / `[]string` in `{{ .Params.kind }}Spec` and every struct it reaches (in both type files) for GCP resource references the generator missed, e.g. `sourceProjectID`, `defaultDatabase`, `kmsKey`, `serviceAccount`, `network`, `repository`. Convert them per 3.2.
        2. **No top-level `Labels`.** Remove `Labels map[string]string` from `{{ .Params.kind }}Spec`; top-level proto `labels` are reconciled from `metadata.labels`. Leaving it fails `TestVerifyLabelsTestCasesExist` once a controller is registered.
        3. **Nested `Etag` and output-only fields.** Check the nested spec structs too. If `{{ .Params.kind }}ObservedState` ends up empty, comment it out (see `empty-observedstate`).
        4. **KRM standards.** `<kind_lowercase>_types.go` must meet all of these:
           - It starts with `// Copyright 2026 Google LLC` (never change the year of an existing file).
           - The kind has `// +kubebuilder:metadata:labels="cnrm.cloud.google.com/managed-by-kcc=true"` and `// +kubebuilder:metadata:labels="cnrm.cloud.google.com/system=true"`.
           - `status.observedGeneration` is exactly `*int64`.
           - Service-generated values (such as `etag`) are never in `spec`; they go in `status.observedState`.
           - Every scalar field is a pointer (`*string`, `*bool`, `*int32`, `*int64`, `*float64`), except `Location` from the embedded `parent.ProjectAndLocationRef`. Slices and maps are never pointers.
           - Acronyms are all upper or all lower case (`vertexAISearchRuntimeConfig`, not `vertexAiSearchRuntimeConfig`).
           - `// +kcc:spec:proto=` is on the Spec, `// +kcc:observedstate:proto=` on the ObservedState (or `// +kcc:status:proto=` on the Status when there's no ObservedState), and `// +kcc:proto=` on each nested struct. One kind maps to one proto message, and back.
           - Hand-maintained structs (with `*Ref` fields, unions/oneofs, recursive types, overrides) live in `<kind_lowercase>_types.go`, which stays as small as possible: parents of moved structs stay generated.
           - Deeply nested or recursive types that break OpenAPI generation are commented out or simplified. `x-kubernetes-preserve-unknown-fields: true` appears only on `apiextensionsv1.JSON` fields that carry free-form user payloads.
        5. **Close it.** Resolve `{{ .Params.kind }}`'s `untriaged-bulk-generation` as `edited` or `accepted`, with a summary note.

        ## 5. Identity and reference

        `generate-identity` writes `<kind_lowercase>_identity.generated.go`, `<kind_lowercase>_reference.generated.go` and `<kind_lowercase>_identity_generated_test.go` (which calls `identity.AssertConformance`). Prefer it to hand-written code.

        1. **Hand-written code wins, declaration by declaration.** For a non-standard parent, write only the custom function (e.g. `getIdentityFrom{{ .Params.kind }}Spec` in `<kind_lowercase>_identity.go`, or `Normalize` in `<kind_lowercase>_reference.go`); the generator still emits the rest without collisions. Promote the generated file to a hand-written `<kind_lowercase>_identity.go` (rename it and drop the `// Code generated by controllerbuilder... DO NOT EDIT.` header) only if `generate-identity` can't express the URL pattern.
        2. **Rules for hand-written identity code:**
           - `var {{ .Params.kind }}IdentityFormat = gcpurls.Template[{{ .Params.kind }}Identity]("<service_name>.googleapis.com", "projects/{project}/...")`. Template variables match the struct fields when lowercased and have no underscores: map `{aspect_type}` to `{aspectType}` and `AspectType`. Keep camelCase collection names (`entryGroups`).
           - Declare `_ identity.IdentityV2 = &{{ .Params.kind }}Identity{}` (or `identity.ServerGeneratedIdentity`) and `_ identity.Resource = &{{ .Params.kind }}{}`. The struct has one field per template variable, `// +k8s:deepcopy-gen=false`, and the doc comment `// {{ .Params.kind }}Identity is the identity of a GCP {{ .Params.kind }} resource.`
           - `String()`, `FromExternal()` and `Host()` delegate to the template. `ParentString()` returns the parent URI (`projects/{project}/locations/{location}` or the parent resource's name), built with the parent's identity type rather than formatted by hand.
           - `getIdentityFrom{{ .Params.kind }}Spec(ctx, reader, obj *{{ .Params.kind }})` takes the typed object and resolves the parent from the parent field chosen in section 2. For a child resource that means: normalize `spec.parentRef` and build the identity from the parent's external reference (or the parent's identity), never from other spec fields, annotations or the namespace. The resource ID is `spec.resourceID`, else `metadata.name`, except for server-generated IDs (item 3).
           - **`GetIdentity` must cross-check the spec identity against `status.externalRef`** when the Status has that field, and return an error if they differ: `cannot change {{ .Params.kind }} identity (old=%q, new=%q)`. If the Status has no such field, return the spec identity. Never change the schema to add one.
